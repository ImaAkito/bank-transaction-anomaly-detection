server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Адрес API определяется через DNS Docker при каждом запросе (с кэшем 10 с), а не один раз при старте:
    # после перезапуска контейнера api интерфейс продолжает работать без ошибки 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass $api_upstream;
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
